<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сын коммерсанта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=PT+Mono&family=PT+Sans:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: один экран телефона; каждая эпоха — интерфейс своего девайса. Компоненты берут цвета из токенов темы (.th-*) */
:root{
  --f-pix:"Press Start 2P","Courier New",monospace;
  --f-mono:"PT Mono","Courier New",monospace;
  --f-serif:"Tinos","Times New Roman",serif;
  --f-ui:"PT Sans",Tahoma,Verdana,sans-serif;
  --f-tv:"Unbounded","Arial Black",sans-serif;
  --f-ios:"Golos Text","Helvetica Neue",Arial,sans-serif;
  --gl:max(14px, env(safe-area-inset-left, 0px));
  --gr:max(14px, env(safe-area-inset-right, 0px));
  /* дефолтные токены (перекрываются темой) */
  --bg:#EDEDED;--fg:#1A1A1A;--muted:#5A5A5A;--line:#BDBDBD;--panel:#FFFFFF;--pfg:#1A1A1A;--head:#E0E0E0;--hfg:#1A1A1A;
  --acc:#2255AA;--afg:#FFFFFF;--sel:#2255AA;--sfg:#FFFFFF;--btn:#F4F4F4;--bfg:#1A1A1A;--bline:#9A9A9A;--good:#1E7A3C;--bad:#B3261E;
  --tk:#1A1A1A;--tkf:#FFFFFF;--font:var(--f-ui);--fh:var(--f-ui);--fs:14px;--r:0px;--cell:#BDBDBD;--cellon:#1A1A1A;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B0B0D;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button[disabled]{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px dashed currentColor;outline-offset:2px}
input{user-select:text;-webkit-user-select:text}

#screen{position:relative;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:1.35}
#top,#tick,#bot{flex:0 0 auto}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:var(--gl);padding-right:var(--gr);padding-block:12px 18px}
#main.wipe{animation:wipe .26s steps(6) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#tick{overflow:hidden;white-space:nowrap;position:relative;height:26px;background:var(--tk);color:var(--tkf);font-size:12.5px}
#tick .tk{position:absolute;top:0;left:0;line-height:26px;will-change:transform}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:96}
#glass{position:absolute;inset:0;pointer-events:none;z-index:100}
.sec{display:flex;flex-direction:column;gap:14px}
.small{font-size:12.5px}.dim{color:var(--muted)}.bad{color:var(--bad)}.good{color:var(--good)}
.hide{display:none!important}

/* ---------- блоки ---------- */
.card{background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.ctitle{background:var(--head);color:var(--hfg);font-family:var(--fh);font-weight:700;font-size:12px;letter-spacing:.4px;padding:7px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 6px;text-align:left;width:100%;font-variant-numeric:tabular-nums;border-radius:calc(var(--r)*.6);align-items:center}
.row .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-weight:400}
.row.sel,button.row:active{background:var(--sel);color:var(--sfg)}
.row.sel .sub,button.row:active .sub{color:inherit;opacity:.85}
.row.locked{opacity:.5}
.row .ico{width:34px;height:34px;flex:0 0 34px;display:block;border-radius:calc(var(--r)*.6)}
.rowi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:2px 10px}
.rowi .sub{grid-column:2/-1}
.btn{min-height:42px;padding:8px 10px;border:1px solid var(--bline);background:var(--btn);color:var(--bfg);border-radius:calc(var(--r)*.7);font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:700}
.btn.pri{background:var(--acc);color:var(--afg);border-color:var(--acc)}
.btn:active:not([disabled]){filter:brightness(.9)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.btns.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.q{border:1px solid var(--bline);background:var(--btn);color:var(--bfg);height:38px;font-size:13px;border-radius:calc(var(--r)*.6)}
.q.on{background:var(--sel);color:var(--sfg);border-color:var(--sel)}
.qty{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pos{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1px 5px;border:1px solid currentColor;border-radius:calc(var(--r)*.4);white-space:nowrap;font-weight:700}
.tag.fact{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.newsl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px;line-height:1.3}
.log{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.chartwrap{border:1px solid var(--line);border-radius:calc(var(--r)*.6);overflow:hidden}
.chartwrap canvas{width:100%;height:130px;display:block}
.spark{width:56px;height:20px}
.mrow{grid-template-columns:42px minmax(0,1fr) 56px 64px 40px!important;align-items:center}
.mrow .v{text-align:right}
.tkr{font-family:var(--f-mono);font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:1px 3px;text-align:center;letter-spacing:.3px}
.secs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.secs::-webkit-scrollbar{display:none}
.secs .q{flex:0 0 auto;padding:0 10px;height:32px;white-space:nowrap}

/* ---------- герой ---------- */
.hero{display:grid;grid-template-columns:124px minmax(0,1fr);gap:12px;align-items:start}
.portrait{width:124px;height:146px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.portrait canvas,.portrait svg,.portrait img{position:absolute;inset:0;width:100%;height:100%}
.portrait canvas.px{image-rendering:pixelated}
.heroinfo{display:flex;flex-direction:column;gap:7px;min-width:0}
.who{font-size:13px;font-weight:700}
.rank{align-self:flex-start;background:var(--acc);color:var(--afg);font-weight:700;font-size:11.5px;padding:4px 8px;border-radius:calc(var(--r)*.5);letter-spacing:.3px}
.quote{font-size:12.5px;color:var(--muted)}
.moneyrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;font-family:var(--fh)}
.moneyrow .r{text-align:right;font-size:12.5px;line-height:1.4}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.mlab{font-size:10.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mcells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;height:10px}
.mcells span{background:var(--cell);border-radius:1px}.mcells span.on{background:var(--cellon)}
.badm .mcells span.on{background:var(--bad)}
.mhelp{font-size:11.5px;color:var(--muted);line-height:1.35}

/* ---------- арт ---------- */
.art{display:block;width:100%;height:auto}
.evart{width:100%;aspect-ratio:16/9;max-height:170px;object-fit:cover;border-radius:calc(var(--r)*.6);border:1px solid var(--line)}
.npc{width:52px;height:52px;flex:0 0 52px;border-radius:calc(var(--r)*.6);border:1px solid var(--line);background:var(--panel)}
.dfrom{display:flex;gap:10px;align-items:center}

/* ---------- диалоги ---------- */
.ov{position:absolute;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;padding-left:var(--gl);padding-right:var(--gr);padding-block:16px;background:rgba(0,0,0,.25)}
.dlg{width:100%;max-width:440px;max-height:100%;display:flex;flex-direction:column;background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;animation:dlgIn .22s cubic-bezier(.2,.9,.3,1.15) both;box-shadow:0 8px 30px rgba(0,0,0,.35)}
@keyframes dlgIn{0%{transform:scale(.8,.1);opacity:.2}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--head);color:var(--hfg);padding:8px 12px;font-weight:700;font-size:12.5px}
.dscroll{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px}
.dtx{white-space:pre-wrap;min-height:2.6em;font-size:14.5px;line-height:1.42}
.dtx .cur{display:inline-block;width:7px;height:1em;background:currentColor;vertical-align:-2px;animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dch{display:flex;flex-direction:column;gap:8px}
.dch .btn{width:100%;justify-content:flex-start;text-align:left;font-weight:700}
.dch .btn .hint{font-weight:400;opacity:.75;font-size:12px;margin-left:auto;padding-left:8px}
.diff{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:3px 7px;border-radius:calc(var(--r)*.5);border:1px solid currentColor;font-weight:700}
.chip.pos{color:var(--good)}.chip.neg{color:var(--bad)}
.dlg input[type=text]{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:calc(var(--r)*.5)}

/* ---------- окна мини-игр ---------- */
.gw{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);animation:gwIn .25s steps(6) both}
@keyframes gwIn{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0 0 0 0)}}
.gw .gh{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:var(--gl);padding-right:var(--gr);background:var(--head);color:var(--hfg);font-weight:700;font-size:13px}
.gw .gh .x{margin-left:auto;border:1px solid currentColor;padding:6px 10px;border-radius:calc(var(--r)*.5);font-size:12px}
.gw .gb{flex:1;min-height:0;overflow-y:auto;padding-block:12px 20px;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.stepper .val{text-align:center;padding:10px 4px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r)*.5)}
.gmsg{min-height:2.6em;padding:8px 10px;font-size:13.5px;background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:calc(var(--r)*.5)}
.cab,.board{padding:14px 12px;position:relative;background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:var(--r)}
.cab .marq{text-align:center;margin-bottom:12px;line-height:1.4;font-weight:700;font-family:var(--fh)}
.lights{position:absolute;left:0;right:0;top:-2px;height:4px;background:repeating-linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 14px);animation:lights .5s steps(2) infinite}
.cab.win .lights{animation-duration:.12s}
@keyframes lights{50%{background-position:7px 0}}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative}
.reel{height:88px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--r)*.5)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.sym{height:88px;display:grid;place-items:center;font-size:38px;font-weight:700}
.payline{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--acc);opacity:.5;pointer-events:none}
.paytable{display:grid;grid-template-columns:auto auto;gap:2px 16px;justify-content:center;font-size:12.5px}
.board{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.board .teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;width:100%;font-weight:700}
.board .score{font-size:30px;font-variant-numeric:tabular-nums}
.board .minute{font-size:12px;opacity:.8}
.pitch{height:8px;width:100%;position:relative;background:var(--bg);border-radius:4px}
.pitch i{position:absolute;top:0;height:100%;width:8px;background:var(--acc);border-radius:50%;transition:left .3s}
.snakebox{display:flex;flex-direction:column;align-items:center;gap:12px}
.snakebox canvas{width:100%;max-width:360px;image-rendering:pixelated;border:2px solid var(--line);touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px}
.dpad .btn{min-height:50px;font-size:18px}
.shells{height:180px;position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);color:var(--pfg)}
.cup{position:absolute;bottom:38px;width:70px;height:72px;margin-left:-35px;transition:left .26s cubic-bezier(.5,0,.5,1),transform .26s;cursor:pointer}
.cup .shape{position:absolute;inset:0;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);background:currentColor}
.cup.up{transform:translateY(-54px) rotate(-6deg)}
.ball{position:absolute;bottom:40px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--acc);transition:left .26s}
.scratch{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:17/10;touch-action:none}
.scratch .under{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;padding:10px;background:var(--panel);border:1px solid var(--line)}
.scratch .under span{display:grid;place-items:center;font-weight:700;font-size:22px;border:2px dashed var(--line)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%}
.mines{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;max-width:340px;margin:0 auto;width:100%}
.mines button{aspect-ratio:1;font-weight:700;font-size:16px;background:var(--btn);border:1px solid var(--bline);border-radius:calc(var(--r)*.4)}
.mines button.open{background:var(--panel);border-color:var(--line)}
.mines button.boom{background:var(--bad)!important;color:#FFF}
.mines-info{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.cards{display:flex;justify-content:center;gap:12px}
.card2{width:92px;height:130px;border-radius:10px;display:grid;place-items:center;font-size:36px;font-weight:700;background:#FFF;color:#111;border:2px solid #111;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.card2.red{color:#C0282D}.card2.back{background:repeating-linear-gradient(45deg,#333 0 6px,#555 6px 12px);color:transparent}
.card2.flip{animation:cflip .35s ease both}@keyframes cflip{0%{transform:rotateY(90deg)}100%{transform:none}}
.farm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:340px;margin:0 auto;width:100%}
.farm button{aspect-ratio:1;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:28px;display:grid;place-items:center;transition:transform .08s}
.farm button:active{transform:scale(.92)}
.farm button.up{background:color-mix(in srgb,var(--good) 22%,var(--panel))}
.farm button.thief{background:color-mix(in srgb,var(--bad) 22%,var(--panel))}

/* ---------- эффекты ---------- */
.floater{position:absolute;z-index:60;font-weight:700;font-size:13px;pointer-events:none;animation:floatUp 1.3s ease-out forwards;white-space:nowrap}
.floater.good{color:var(--good)}.floater.bad{color:var(--bad)}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{transform:translateY(-6px) scale(1.15);opacity:1}100%{transform:translateY(-46px);opacity:0}}
.toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);z-index:97;padding:8px 12px;font-size:13px;font-weight:700;max-width:86%;text-align:center;animation:toast 2.2s forwards;background:var(--fg);color:var(--bg);border-radius:var(--r)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.shake{animation:shake .45s steps(9)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,2px)}}
.flash{animation:flash .35s steps(3)}
@keyframes flash{50%{filter:invert(1)}}

/* ---------- полноэкранные заставки ---------- */
.seq{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding-left:var(--gl);padding-right:var(--gr);overflow:hidden;background:var(--bg);color:var(--fg)}
.seq canvas.noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.9}
.seq .inner{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:360px}
.seq .t1{font-family:var(--fh);font-weight:700;font-size:15px;line-height:1.5}
.seq .devart{width:min(64vw,240px);aspect-ratio:3/4}
.seq .pbar{height:16px;width:100%;border:1px solid var(--line);background:var(--panel);padding:2px;display:flex;gap:2px}
.seq .pbar i{width:9px;background:var(--acc)}
.seq.title{justify-content:flex-start;padding-top:22px;text-align:left;align-items:stretch}
.title .logo1{font-family:var(--f-pix);font-size:clamp(16px,5vw,22px);line-height:1.5}
.title .menu{display:flex;flex-direction:column;border:3px solid currentColor;margin-top:6px}
.title .menu button{min-height:48px;text-align:left;padding:8px 12px;border-top:2px dotted currentColor;font-size:15px;font-weight:700}
.title .menu button:first-child{border-top:0}
.title .menu button:active{background:var(--fg);color:var(--bg)}
.title .keyart{width:100%;max-height:34vh;object-fit:contain}
.credits{position:absolute;inset:0;z-index:94;background:#101012;color:#E6E6E0;overflow:hidden;font-family:var(--f-mono);text-align:center}
.credits .roll{position:absolute;left:0;right:0;padding-left:var(--gl);padding-right:var(--gr);display:flex;flex-direction:column;gap:12px;align-items:center}
.credits h2{font-family:var(--f-tv);font-weight:800;font-size:22px;margin:18px 0 0}
.credits .stamp{font-family:var(--f-tv);font-weight:800;font-size:30px;color:#C9EE5A}
.credits .skip{position:absolute;right:var(--gr);bottom:max(16px, env(safe-area-inset-bottom, 0px));z-index:2;border:1px solid currentColor;padding:10px 14px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* ======================================================================
   12 интерфейсов: каждый — отсылка к узнаваемому девайсу или программе своего года
   ====================================================================== */

/* ---------- 2000 · кнопочная трубка: монохромный LCD, меню-карусель ---------- */
.th-n3310{--bg:#A9B58C;--fg:#1F2719;--muted:#3B4730;--line:#1F2719;--panel:#A9B58C;--pfg:#1F2719;--head:#1F2719;--hfg:#B7C29A;--acc:#1F2719;--afg:#B7C29A;--sel:#1F2719;--sfg:#B7C29A;
 --btn:#A9B58C;--bfg:#1F2719;--bline:#1F2719;--good:#1F2719;--bad:#1F2719;--tk:#1F2719;--tkf:#B7C29A;--font:var(--f-mono);--fh:var(--f-pix);--fs:14px;--r:0px;--cell:#8C9970;--cellon:#1F2719;font-weight:700}
.th-n3310 #glass{background-image:linear-gradient(rgba(31,39,25,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(31,39,25,.05) 1px,transparent 1px);background-size:3px 3px}
.th-n3310 .card{border-width:2px}.th-n3310 .ctitle{font-size:9px;font-weight:400;padding:7px 8px}
.th-n3310 .btn,.th-n3310 .q{border-width:2px}.th-n3310 .big{font-family:var(--f-mono);font-size:30px}
.th-n3310 .rank{font-family:var(--f-pix);font-weight:400;font-size:9px;padding:6px 7px}

.w-addr .wd{font-weight:700;font-size:12px;white-space:nowrap}
.w-tabs{display:flex;gap:3px;padding:4px var(--gr) 2px var(--gl);background:#C0C0C0;border-top:2px solid #FFF;font-size:12.5px}
.w-tabs button{flex:1;min-width:0;height:36px;border:2px outset #E8E8E8;background:#C0C0C0;display:flex;align-items:center;justify-content:center;gap:4px;transform:none;padding:0 2px}
.w-tabs button i{font-style:normal;font-size:12px}
.w-tabs button.on{border-style:inset;font-weight:700;transform:none;background-color:#E0E0E0;background-image:conic-gradient(#FFF 25%,transparent 0 50%,#FFF 0 75%,transparent 0);background-size:2px 2px}
.w-task{border-top:0}
/* XP · кнопки окон на синей панели */
.x-tabs{display:flex;gap:3px;padding:4px var(--gr) 2px var(--gl);background:linear-gradient(#3F8CF3,#245EDB 10%,#2056C8);border-top:1px solid #6A9BF2}
.x-tabs button{flex:1;min-width:0;height:36px;border-radius:3px;background:linear-gradient(#5A9AF7,#3B7FE8);border:1px solid #1941A5;color:#FFF;font-size:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 2px}
.x-tabs button i{font-style:normal;font-size:12px}
.x-tabs button.on{background:linear-gradient(#1A47A8,#1E5ACF);border:1px solid #10306E;border-top:1px solid #10306E;height:36px;box-shadow:inset 1px 1px 3px rgba(0,0,0,.5);font-weight:700}
.x-task{border-top:0}
.th-xp #nextBtn{background:linear-gradient(#F7FBFF,#D9E7FA);color:#0A246A;border-color:#7F9DB9;text-shadow:none}
/* плеер */
.a-bot .a-ctl{margin-bottom:6px}
.a-row{display:grid;grid-template-columns:50px minmax(0,1fr);gap:6px}
.a-row .sys{height:50px;background:linear-gradient(#5C6270,#3F444E);border:1px solid #14161A;box-shadow:inset 0 1px 0 #7A8090;color:#E9E9E9;font-size:18px}
.a-bar{min-height:12px}
/* колёсико: разделы над колесом */
.i-crumbs{margin:0 10px;border:1px solid #C9CED4;border-top:1px solid #E1E4E8;border-radius:0 0 8px 8px;overflow:hidden}
.i-crumbs button{height:38px}
.i-top{border-bottom:1px solid #C9CED4}
/* коммуникатор */
.wm-today{grid-template-columns:auto minmax(0,1fr)}
/* QWERTY-смартфон */
.bb-tabs{border-bottom:0;border-top:1px solid var(--line)}
/* сенсорный */
.o-tool{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px}
.o-tool .sys{height:42px;border-radius:7px;background:linear-gradient(#90A2BC,#5D7699);border:1px solid #3D4F6B;color:#FFF;font-size:18px;font-weight:700}
/* соцсеть: мобильная версия */
.v-bot{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:8px var(--gr) 6px var(--gl)}
.v-bot .sys{height:44px;background:#DFE6ED;color:#2B587A;border-radius:3px;font-size:18px;font-weight:700}
.v-menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;border-bottom:0;border-top:1px solid var(--line);padding:4px var(--gr) max(8px,env(safe-area-inset-bottom,0px)) var(--gl);overflow:visible}
.v-menu button{height:46px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
.v-menu button .g{font-size:15px;line-height:1;color:#5E81A8}
.v-top{padding-block:6px}

/* ===================== ПОСТОБРАБОТКА ЭКРАНА — ТОНКО, ПО ЭПОХАМ ===================== */
/* ЧБ и янтарный LCD: пиксельная сетка, затемнение к краям, глубина стекла */
.th-n3310 #glass{background-image:linear-gradient(rgba(31,39,25,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(31,39,25,.06) 1px,transparent 1px),radial-gradient(ellipse 130% 95% at 50% 45%,transparent 62%,rgba(31,39,25,.16));background-size:3px 3px,3px 3px,100% 100%;box-shadow:inset 0 8px 16px -6px rgba(0,0,0,.18)}
.th-siem #glass{background-image:radial-gradient(ellipse at 50% 25%,rgba(255,240,190,.2),transparent 65%),linear-gradient(rgba(42,30,8,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(42,30,8,.05) 1px,transparent 1px),radial-gradient(ellipse 130% 95% at 50% 45%,transparent 62%,rgba(42,30,8,.18));background-size:100% 100%,3px 3px,3px 3px,100% 100%;box-shadow:inset 0 8px 16px -6px rgba(0,0,0,.16)}
/* первые цветные экраны: еле заметная субпиксельная решётка и блик пластика */
.th-t610 #glass,.th-s60 #glass{background-image:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,0) 28%),repeating-linear-gradient(90deg,rgba(255,0,0,.018) 0 1px,rgba(0,255,0,.018) 1px 2px,rgba(0,0,255,.018) 2px 3px)}
/* ЭЛТ-монитор: строки развёртки и мягкая виньетка */
.th-w98 #glass,.th-xp #glass{background-image:repeating-linear-gradient(rgba(0,0,0,.028) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 70%,rgba(0,0,0,.14))}
/* плеер: свечение ЖК-цифр и развёртка */
.th-winamp #glass{background-image:repeating-linear-gradient(rgba(0,0,0,.08) 0 1px,transparent 1px 3px),radial-gradient(ellipse 120% 100% at 50% 50%,transparent 65%,rgba(0,0,0,.3))}
.th-winamp .a-lcd,.th-winamp .big,.th-winamp .ctitle{text-shadow:0 0 6px rgba(127,212,147,.35)}
.th-winamp .a-lcd .tm{text-shadow:0 0 8px rgba(127,212,147,.6)}
/* глянцевые экраны: косой блик стекла */
.th-ios #glass{background-image:linear-gradient(118deg,rgba(255,255,255,.07) 0 38%,rgba(255,255,255,0) 38.3%)}
.th-bb #glass,.th-wm #glass{background-image:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,0) 22%)}
/* модальные окна на сенсорных и веб-эпохах — фон слегка размыт */
.th-ios .ov,.th-vk .ov,.th-bb .ov,.th-wm .ov{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
/* на ЧБ-экране всё, что за окном, «гаснет» сеткой, как на настоящем LCD */
.th-n3310 .ov,.th-siem .ov{background:repeating-conic-gradient(rgba(0,0,0,.12) 0 25%,transparent 0 50%) 0 0/2px 2px}

/* ===================== ИЕРАРХИЯ: ТРИ УРОВНЯ ВАЖНОСТИ =====================
   1 — главное число экрана (наличные / цена), крупно;
   2 — названия и суммы в строках, жирно;
   3 — подписи, пояснения, журнал — мелко и приглушённо. */
.cap{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--muted);line-height:1.2}
.card .cap{color:inherit;opacity:.62}
.foot{font-size:11.5px;color:var(--muted);line-height:1.4;margin:0;padding:0 2px}

/* герой */
.hero{grid-template-columns:104px minmax(0,1fr);gap:12px}
.portrait{width:104px;height:124px}
.heroinfo{gap:6px}
.who{font-size:19px;font-weight:800;line-height:1.1;font-family:var(--fh)}
.who span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px;font-family:var(--font)}
.rank{font-size:10.5px;padding:3px 7px;letter-spacing:.6px}
.quote{font-size:12.5px;font-style:italic;line-height:1.35}

/* кошелёк — фокус главного экрана */
.wallet{background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px}
.wallet>.cap{color:inherit;opacity:.62}
.wl-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-size:38px;letter-spacing:-.5px;line-height:1;font-weight:800}
.delta{display:inline-flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:17px;color:var(--good);font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.delta small{font-size:10px;font-weight:400;opacity:.7;color:var(--pfg);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.delta.neg{color:var(--bad)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.stats3>div,.holding>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats3 .cap,.holding .cap{color:inherit;opacity:.62;font-size:9.5px}
.stats3 b{font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* шкалы: подпись мелко, число жирно */
.mlab{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.mlab .cap{font-size:9.5px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.mlab b{font-size:13px;font-variant-numeric:tabular-nums}
.mlab.bad .cap,.mlab.bad b{color:var(--bad)}
.mhelp{font-size:11px}

/* строки: название и сумма — второй уровень */
.row .nm{font-weight:700;font-size:15px;min-width:0;line-height:1.25}
.row .val{font-weight:800;font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .val small{font-size:11px;font-weight:400;opacity:.75;margin-left:2px}
.row .cnt{font-weight:400;opacity:.65;font-size:13px}
.row .sub{font-size:12px;line-height:1.3}
.row.mine{box-shadow:inset 3px 0 0 var(--acc);padding-left:10px}
.row.sel .val,.row.sel .good,.row.sel .bad{color:inherit}
.row .chip{font-size:11px;padding:2px 6px}

/* второстепенные блоки — без тяжёлых шапок */
.flat{display:flex;flex-direction:column;gap:4px}
.ftitle{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:700;color:var(--muted);padding:2px 2px 5px;border-bottom:1px solid var(--line)}
.ftitle span:last-child{letter-spacing:0;text-transform:none;font-weight:400}
.fbody{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.log{font-size:12.5px;color:var(--muted);gap:4px}
.log div:first-child{color:var(--fg)}

/* биржа: цена — главное число */
.qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.price{font-size:30px;font-weight:800;line-height:1.05;font-family:var(--fh);font-variant-numeric:tabular-nums;margin-top:2px}
.holding{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.holding b{font-size:14px;font-variant-numeric:tabular-nums}
.mnm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.own{font-style:normal;color:var(--acc);font-size:8px;vertical-align:2px}
.mrow.sel .own{color:inherit}
.mrow .v:nth-last-child(2){font-weight:800}
.ctitle .tkr{font-size:10px}

/* главное действие — заметнее остальных кнопок */
.btn.pri{min-height:46px;font-size:14.5px}

/* ---------- поправки под шрифты и экраны эпох ---------- */
.th-n3310 .big{font-size:34px}.th-n3310 .price{font-family:var(--f-mono);font-size:28px}
.th-n3310 .who,.th-siem .who{font-size:17px}
.th-n3310 .row .nm,.th-siem .row .nm,.th-n3310 .row .val,.th-siem .row .val{font-size:14px}
.th-winamp .big{font-size:24px}.th-winamp .price{font-family:var(--f-pix);font-size:20px;color:#7FD493;font-weight:400}
.th-winamp .who{font-size:16px}
.th-w98 .who{font-family:var(--f-serif)}
.th-ios .flat .fbody,.th-vk .flat .fbody{background:#FFF;border:1px solid var(--line);border-radius:var(--r);padding:2px 10px}
.th-ios .flat .ftitle{border:0;color:#4C566C;text-shadow:0 1px 0 #FFF}
.th-ios .wallet{border-color:#A9B1BC;border-radius:10px}
.th-vk .flat .ftitle{border:0;color:#45688E}
.th-bb .flat .fbody{background:#FFF;border:1px solid var(--line);border-radius:4px;padding:2px 8px}

/* ===================== ТОЧКИ ИНТЕРЕСА =====================
   Порядок взгляда на Хате после «Дальше»: деньги → тревога (если есть) → что появилось → герой → подробности.
   На Бирже: портфель → самые резкие движения месяца → выбранная бумага → список. */
.wl-top{display:flex;justify-content:space-between;gap:8px}
.wl-top .cap{color:inherit;opacity:.62}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 11px;border-radius:var(--r);font-size:13px;font-weight:700;line-height:1.3;border:1px solid var(--line);background:var(--panel);color:var(--pfg)}
.alert i{font-style:normal;flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--acc);color:var(--afg)}
.alert.bad{color:var(--bad);border-color:currentColor;background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.alert.bad i{background:var(--bad);color:var(--panel)}
button.alert::after{content:'›';margin-left:auto;font-size:18px;opacity:.5}
.news-new{display:flex;flex-direction:column}
.newcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;padding-top:6px}
.newc{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;gap:2px 8px;text-align:left;padding:10px 12px;background:var(--panel);color:var(--pfg);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--acc);border-radius:var(--r)}
.newc .cap{color:inherit;opacity:.6}
.newc b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newc i{font-style:normal;font-size:20px;opacity:.45;grid-column:2;grid-row:1/3}
.newc .cap,.newc b{grid-column:1}
.newt{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:2px 5px;margin-right:6px;border-radius:calc(var(--r)*.5);background:var(--acc);color:var(--afg);vertical-align:2px;line-height:1.1;font-family:var(--font)}
[role=tab]{position:relative}
.nb{position:absolute;top:5px;right:calc(50% - 22px);width:9px;height:9px;border-radius:50%;background:#E5382D;box-shadow:0 0 0 2px rgba(255,255,255,.85);animation:nbIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes nbIn{from{transform:scale(0)}to{transform:none}}
.th-n3310 .nb,.th-siem .nb{background:var(--fg);border-radius:0;box-shadow:0 0 0 2px var(--bg);width:7px;height:7px}
.th-w98 .nb,.th-xp .nb{top:3px;right:4px}
.th-winamp .nb{background:#7FD493;box-shadow:0 0 6px #7FD493}
.mstrip{display:flex;flex-direction:column;gap:10px}
.pf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);color:var(--pfg);border:1px solid var(--line);border-radius:var(--r);text-align:left}
.pf .cap{color:inherit;opacity:.62}
.pf b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pf .delta{font-size:14px}
.movers{display:flex;flex-direction:column;gap:6px}
.mvs{display:flex;gap:6px;flex-wrap:wrap}
.mv{display:inline-flex;gap:6px;align-items:center;height:34px;padding:0 10px;border-radius:calc(var(--r)*.7);border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.mv.up{color:var(--good)}.mv.dn{color:var(--bad)}.mv .tkr{color:var(--pfg)}
.mv.on{box-shadow:0 0 0 2px var(--acc)}
.mrow .v.dim{font-weight:400}
.th-ios .newc,.th-ios .pf,.th-ios .alert{border-radius:10px;border-color:#A9B1BC}

/* ===================== ДВИЖЕНИЕ, ОТКЛИК, ДЕТАЛИ ===================== */
/* переходы между разделами — у каждого девайса свой */
#main{--dir:1}
#main.tr-step{animation:trStep .3s steps(5) both}
@keyframes trStep{0%{clip-path:inset(0 100% 0 0);opacity:.4}100%{clip-path:inset(0 0 0 0);opacity:1}}
#main.tr-slide{animation:trSlide .26s cubic-bezier(.2,.8,.25,1) both}
@keyframes trSlide{from{transform:translateX(calc(var(--dir)*28px));opacity:0}to{transform:none;opacity:1}}
#main.tr-push{animation:trPush .34s cubic-bezier(.25,.9,.3,1) both}
@keyframes trPush{from{transform:translateX(calc(var(--dir)*100%))}to{transform:none}}
#main.tr-fade{animation:trFade .22s ease-out both}
@keyframes trFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#main.tr-flick{animation:trFlick .18s steps(3) both}
@keyframes trFlick{0%{opacity:0}34%{opacity:1;filter:brightness(1.4)}67%{opacity:.6}100%{opacity:1;filter:none}}

/* отклик кнопок */
.btn,.q,.tab,#nextBtn,.row,.sk,.sys{transition:transform .08s ease,filter .08s ease,background-color .12s ease}
.btn:active:not([disabled]),.q:active,#nextBtn:active{transform:translateY(1px)}
.th-ios .btn:active:not([disabled]),.th-vk .btn:active:not([disabled]),.th-ipod .btn:active:not([disabled]),.th-bb .btn:active:not([disabled]),.th-ios #nextBtn:active,.th-vk #nextBtn:active{transform:scale(.97)}
.th-n3310 .btn:active:not([disabled]),.th-siem .btn:active:not([disabled]),.th-n3310 .q:active,.th-siem .q:active{transform:none;background:var(--fg);color:var(--bg)}
.th-ios button.row:active{background:linear-gradient(#058CF5,#015EE6);color:#FFF}
.th-bb #nextBtn:active{transform:scale(.94);box-shadow:0 0 0 3px #2A3039,inset 0 2px 6px rgba(0,0,0,.4)}
.th-ipod #nextBtn:active{transform:scale(.95)}
.i-wheel .w:active{color:#2F6CC6}
.bb-keys .k:active{transform:translateY(1px);filter:brightness(1.2)}

/* деньги и шкалы */
.big{transition:color .3s}
.big.pulse-up{animation:pulseUp .7s ease-out}
.big.pulse-dn{animation:pulseDn .7s ease-out}
@keyframes pulseUp{0%{transform:scale(1)}20%{transform:scale(1.07);color:var(--good)}100%{transform:none}}
@keyframes pulseDn{0%{transform:none}15%{transform:translateX(-3px);color:var(--bad)}30%{transform:translateX(3px)}45%{transform:translateX(-2px)}100%{transform:none}}
.meter.m-up .mcells span.on:last-of-type,.meter.m-up .mcells{animation:mUp .6s ease-out}
.meter.m-dn .mcells{animation:mDn .6s ease-out}
@keyframes mUp{0%{filter:brightness(1.6)}100%{filter:none}}
@keyframes mDn{0%,40%{opacity:.35}20%,60%{opacity:1}100%{opacity:1}}
.meter .mcells span.on{animation:cellIn .35s ease-out both}
.meter .mcells span.on:nth-child(2){animation-delay:.02s}.meter .mcells span.on:nth-child(3){animation-delay:.04s}.meter .mcells span.on:nth-child(4){animation-delay:.06s}.meter .mcells span.on:nth-child(5){animation-delay:.08s}
.meter .mcells span.on:nth-child(6){animation-delay:.1s}.meter .mcells span.on:nth-child(7){animation-delay:.12s}.meter .mcells span.on:nth-child(8){animation-delay:.14s}.meter .mcells span.on:nth-child(9){animation-delay:.16s}.meter .mcells span.on:nth-child(10){animation-delay:.18s}
@keyframes cellIn{from{transform:scaleY(.2);opacity:.3}to{transform:none;opacity:1}}

/* котировки мигают при новом месяце */
.mrow.fl-up{animation:flUp 1.1s ease-out}
.mrow.fl-dn{animation:flDn 1.1s ease-out}
@keyframes flUp{0%,30%{background:color-mix(in srgb,var(--good) 22%,transparent)}100%{background:transparent}}
@keyframes flDn{0%,30%{background:color-mix(in srgb,var(--bad) 20%,transparent)}100%{background:transparent}}
.mrow.sel.fl-up,.mrow.sel.fl-dn{animation:none}

/* значок типа сообщения в шапке диалога */
.kic{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;font-size:13px;flex:0 0 20px;line-height:1}
.dlg[data-kind="call"] .kic{animation:ring .5s ease-in-out 3}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-18deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
.dlg[data-kind="sms"] .kic,.dlg[data-kind="icq"] .kic{animation:bounce .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bounce{0%{transform:translateY(-8px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.kic.k-alarm{color:var(--bad);animation:blink .5s steps(1) 6}
.dhead{display:flex;align-items:center}
.th-ios .kic,.th-mtv .kic{display:none}

let AV_SEQ=0;
function avatarSVG(o,pal){
 const X='av'+(++AV_SEQ)+'_';const I=pal.I,P=pal.P,I2=pal.I2||pal.I;
 const defs=`<defs>
<pattern id="${X}h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${I}" stroke-width="1.2"/></pattern>
<pattern id="${X}l" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="6" stroke="${I}" stroke-width="0.7"/></pattern>
<pattern id="${X}c" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><line x1="0" y1="0" x2="0" y2="5" stroke="${I}" stroke-width="1.1"/><line x1="0" y1="0" x2="5" y2="0" stroke="${I}" stroke-width="1.1"/></pattern>
<pattern id="${X}s" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="0.7" fill="${I}"/><circle cx="4.5" cy="4" r="0.6" fill="${I}"/></pattern>
<pattern id="${X}p" width="7" height="7" patternUnits="userSpaceOnUse"><line x1="3" y1="0" x2="3" y2="7" stroke="${P}" stroke-width="0.6" opacity="0.45"/></pattern></defs>`;
 const L=['base',o.outfit||'hoodie'];if(o.stubble)L.push('stubble');L.push(o.mood||'ok');L.push(o.hair||'spikes');
 ['bruise','aviators','headphones','sweat','chain','phone'].forEach(k=>{if(o[k])L.push(k);});if(o.extra)o.extra.forEach(k=>L.push(k));
 const body=L.map(k=>(AV_LAYERS[k]||'')).join('').replace(/\{I\}/g,I).replace(/\{P\}/g,P).replace(/\{I2\}/g,I2).replace(/\{X\}/g,X);
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" aria-hidden="true">${defs}<rect width="240" height="280" fill="${P}"/>${body}</svg>`;
}
// LCD: рендерим в маленький канвас и бинаризуем — как на экране трубки
function avatarLCD(o,target,pal){pal=pal||[[32,40,26],[140,153,112],[169,181,140]];
 const svg=avatarSVG(o,{I:'#000000',P:'#FFFFFF',I2:'#333333'});
 const img=new Image();const W=66,H=77;const c=document.createElement('canvas');c.className='px';c.width=W;c.height=H;target.appendChild(c);
 img.onload=()=>{try{const x=c.getContext('2d');x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H);const p=d.data;
  const ink=pal[0],mid=pal[1],bg=pal[2];
  for(let i=0;i<p.length;i+=4){const l=p[i]*.3+p[i+1]*.59+p[i+2]*.11;const px=(i/4)%W,py=Math.floor(i/4/W);
   const thr=((px+py)%2?150:110);const col=l<thr-40?ink:(l<thr+60?((px+py)%2?ink:mid):bg);p[i]=col[0];p[i+1]=col[1];p[i+2]=col[2];p[i+3]=255;}
  x.putImageData(d,0,0);}catch(e){}};
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function pyramidFate(){const c=16+Math.floor(Math.random()*15);const kf=[[8,100],[c,Math.round(100*Math.pow(1.12,c-8))],[c+1,3]];return {kf,to:c+2,payout:0,end:'Фонд «Золотые купола» закрылся. Офис пуст, директор в Бразилии. Пайщики остались с бумажками.'};}

function ipoText(s,id,lead){const a=ASSETS.find(x=>x.id===id);return `${lead}\n\nЦена размещения — ${fmtP(s.price[id]*.95)} руб. за ${a.unit}. С хорошими связями дадут всё, что попросишь. Без связей — половину заявки.`;}
function IPO_CH(id){return [['Заявка на 20% денег',s=>ipoBuy(s,id,.2)],['Заявка на 50% денег',s=>ipoBuy(s,id,.5)],['Подождать торгов',()=>'Посмотрим, как пойдёт.']];}
function ipoBuy(s,id,f){const full=s.rep>=30;const q=buyAsset(s,id,s.cash*f*(full?1:.5),.95);return q?`Получил ${fmt(q)} ${ASSETS.find(x=>x.id===id).unit}.${full?'':' Без связей — половину заявки.'}`:'Заявку не удовлетворили.';}

'use strict';
// ===================== ЯДРО: экономика и события (без DOM) =====================
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fmt(n){n=Math.round(n);const neg=n<0;const t=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (neg?'−':'')+t;}
function fmtP(p){if(p>=1000)return fmt(p);if(p>=100)return p.toFixed(0);if(p>=10)return p.toFixed(1).replace('.',',');return p.toFixed(2).replace('.',',');}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const dateStr=m=>`${MONTHS[m%12]} ${2000+Math.floor(m/12)}`;
const dateFull=m=>`${MONTHS_FULL[m%12]} ${2000+Math.floor(m/12)}`;
function nice(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,v))));const m=v/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}

const EVENTS=[].concat(EV_ANY.map(e=>({...e,any:1})),EV_LCD,EV_FLIP,EV_WEB,EV_AMP,EV_TV,EV_TOUCH,EV_BIG,EV_MKT,EV_CORP.map(e=>({...e,corp:1})),EV_BIZ.map(e=>({...e,corp:1})),EV_OWN.map(e=>({...e,own:1})),EV_STATE.map(e=>({...e,own:1})),EV_ARCS.map(e=>({...e,arc:1})),EV_LEG,EV_HOLD.map(e=>({...e,own:1})),EV_OWN2.map(e=>({...e,own:1})),EV_ERA2,EV_MORE);
EVENTS.forEach(e=>{if(GUARD[e.id]){const g=GUARD[e.id],c0=e.cond;e.cond=c0?(s=>g(s)&&c0(s)):g;}if(PATCH[e.id])e.ch=PATCH[e.id];if(FLAVOR[e.id]!=null){const c=e.ch[FLAVOR[e.id]]||e.ch[0];e.ch=[[c[0],c[1]]];e.flavor=1;}});

// ---------- цены ----------
function kfInterp(kf,m){if(m<=kf[0][0])return kf[0][1];for(let i=1;i<kf.length;i++){if(m<=kf[i][0]){const [m0,v0]=kf[i-1],[m1,v1]=kf[i];const t=(m-m0)/(m1-m0);return Math.exp(Math.log(v0)+(Math.log(v1)-Math.log(v0))*t);}}return kf[kf.length-1][1];}
const fate=(s,id)=>(s.fk&&s.fk[id])||AS[id];
const toOf=(s,id)=>fate(s,id).to||Infinity;
function path(s,id,m){const a=AS[id];let p;if(a.usd)p=kfInterp(a.usd,m)*kfInterp(AS.usd.kf,m);else p=kfInterp(fate(s,id).kf,m);
 const t=(s.tilt[id]||0)*clamp((m-a.from)/60,0,1)+(s.adj[id]||0);return p*Math.exp(t);}
const avail=(s,a)=>s.m>=a.from&&s.m<toOf(s,a.id);

// ---------- новая игра ----------
function newGame(name){
 const s={v:4,name:name||'Димон',m:0,cash:100000,debt:0,margin:0,hp:100,rep:10,heat:0,krysha:'none',
  hold:{},cost:{},price:{},hist:{},dev:{},tilt:{},adj:{},fk:{},biz:{},bm:{},items:{},flags:{},seen:{},cool:{},tv:{},lo:{},later:[],notes:[],log:[],mod:{inc:1},ctx:null,
  stats:{bets:0,betWon:0,slots:0,slotWon:0,snakeBest:0,lastInc:0,incBy:{},delta:0,divs:0,events:0,mcalls:0},
  lim:{},rumor:null,news:[],quote:BATYA_QUOTES[0],over:null,ui:{tab:'hub',sel:'usd',qty:1,sec:'all'}};
 ASSETS.forEach(a=>{
  if(a.pyramid)s.fk[a.id]=pyramidFate();
  else if(a.fates){let r=Math.random(),f=a.fates[a.fates.length-1];for(const x of a.fates){r-=x.p;if(r<=0){f=x;break;}}s.fk[a.id]={kf:f.kf,to:f.to,payout:f.payout,end:f.end};}
  s.tilt[a.id]=isStock(a)&&!a.pyramid?gauss()*.22:0;
  s.dev[a.id]=0;s.hold[a.id]=0;s.cost[a.id]=0;s.price[a.id]=path(s,a.id,Math.max(0,a.from));
  if(a.from>0)s.hist[a.id]=[s.price[a.id]];
  else{const h=[];for(let k=-11;k<=0;k++)h.push(path(s,a.id,0)*Math.exp(a.vol*.35*gauss()));h[h.length-1]=s.price[a.id];s.hist[a.id]=h;}});
 BIZ.forEach(b=>s.biz[b.id]=0);s.biz.kiosk=1;
 addLog(s,'Батя отдал ларёк и 100 000 руб. Нулевые начинаются.');
 buildNews(s);
 return s;
}

// ---------- справочники ----------
const assetName=id=>(AS[id]||{}).name||id;
const unitOf=id=>(AS[id]||{}).unit||'';
const cname=id=>assetName(id).replace(/[«»]/g,'');
const bizName=id=>(BIZ.find(b=>b.id===id)||{}).name||id;
const bizCount=s=>BIZ.reduce((t,b)=>t+s.biz[b.id],0);
const bizOpen=(s,b)=>s.m>=b.from&&(b.to==null||s.m<b.to);
const bizCost=(s,id)=>{const b=BIZ.find(x=>x.id===id);return Math.round(b.cost*Math.pow(1.3,s.biz[id])/100)*100;};
const curveOf=(b,m)=>b.curve?clamp(b.curve(m),.1,1.3):1;
const bizSell=(s,id)=>{const b=BIZ.find(x=>x.id===id);const n=s.biz[id];if(!n)return 0;return Math.round(b.cost*Math.pow(1.3,n-1)*.6*curveOf(b,s.m)/100)*100;};
function bizValue(s,id){const b=BIZ.find(x=>x.id===id);const n=s.biz[id];if(!n)return 0;return Math.round(b.cost*Math.pow(1.3,n-1)*curveOf(b,s.m));}
const itemOpen=(s,it)=>s.m>=it.from&&(it.to==null||s.m<it.to);
const kryshaOpen=(s,id)=>{const k=KRYSHA[id];return (k.from==null||s.m>=k.from)&&(k.to==null||s.m<k.to);};
function assetVal(s){let v=0;ASSETS.forEach(a=>{if(s.hold[a.id])v+=s.hold[a.id]*s.price[a.id];});return v;}
function netWorth(s){let v=s.cash-s.debt-s.margin+assetVal(s);BIZ.forEach(b=>{const cm=curveOf(b,s.m);for(let i=0;i<s.biz[b.id];i++)v+=b.cost*Math.pow(1.3,i)*.6*cm;});ITEMS.forEach(it=>{if(s.items[it.id])v+=it.cost*.3;});return v;}
const loanLimit=s=>Math.round((100000+Math.max(0,netWorth(s)+s.debt)*.5)*(1+s.rep/200)/1000)*1000;
const loanRate=s=>s.flags.hirate>s.m?.05:s.flags.cheap>s.m?.015:Math.max(.012,.03-s.rep*.00015-(s.flags.married!=null?.004:0));
const marginLimit=s=>s.m<MARGIN_FROM?0:Math.max(0,Math.round(assetVal(s)*.5-s.margin));
function rank(s){const nw=netWorth(s);let r=RANKS[0][1];RANKS.forEach(([t,n])=>{if(nw>=t)r=n;});return r;}
function sc(s,base){return Math.max(100,Math.round(base*Math.max(1,Math.sqrt(Math.max(0,netWorth(s))/300000))/100)*100);}
const pct=(s,f)=>Math.round(Math.max(0,netWorth(s))*f);
function addCash(s,n){s.cash+=Math.round(n);if(s.cash<0){s.debt+=-s.cash;s.cash=0;}}
const addRep=(s,n)=>{s.rep=clamp(s.rep+n,0,100);};
const addHp=(s,n)=>{s.hp=clamp(s.hp+n,0,100);};
const addHeat=(s,n)=>{s.heat=clamp(s.heat+n,0,100);};
function buyAsset(s,id,money,mul=1){if(!avail(s,AS[id]))return 0;const p=s.price[id]*mul;const q=Math.floor(Math.max(0,Math.min(money,s.cash))/p);if(q<1)return 0;const c=Math.round(q*p);s.cash-=c;s.hold[id]+=q;s.cost[id]+=c;return q;}
function sellAsset(s,id,q){q=Math.min(q||0,s.hold[id]);if(q<1)return 0;const got=Math.round(q*s.price[id]);s.cost[id]*=(s.hold[id]-q)/s.hold[id];s.hold[id]-=q;s.cash+=got;return got;}
function shockAsset(s,id,mag){s.dev[id]+=Math.log(1+mag);s.price[id]=path(s,id,s.m)*Math.exp(s.dev[id]);}
function tilt(s,id,d){if(!id||!AS[id])return;s.adj[id]=(s.adj[id]||0)+d;s.price[id]=path(s,id,s.m)*Math.exp(s.dev[id]);}
function marketShock(s,mag){ASSETS.forEach(a=>{if(isStock(a)&&avail(s,a)&&!a.pyramid)shockAsset(s,a.id,mag*rnd(.7,1.3));});}
function sellSector(s,secs){let g=0;ASSETS.forEach(a=>{if(secs.includes(a.sec)&&s.hold[a.id])g+=sellAsset(s,a.id,s.hold[a.id]);});return g;}
function addLog(s,t){s.log.unshift(`${dateStr(s.m)} — ${t}`);if(s.log.length>14)s.log.pop();}
function age(s){return 18+Math.floor(s.m/12);}

// ---------- бизнес-хелперы для событий ----------
function bestBiz(s){let best=null,bv=0;BIZ.forEach(b=>{if(s.biz[b.id]&&b.id!=='club'){const v=bizValue(s,b.id);if(v>bv){bv=v;best=b.id;}}});return best;}
function randBiz(s){const own=BIZ.filter(b=>s.biz[b.id]&&b.id!=='club');if(!own.length)return null;const nk=own.filter(b=>b.id!=='kiosk');const pool=nk.length&&chance(.85)?nk:own;return pick(pool).id;}
function loseBiz(s,id){if(id&&s.biz[id]>0)s.biz[id]--;}
function bmod(s,id,mul,months){if(!id)return;s.bm[id]={mul,until:s.m+months};}
function bmodAll(s,mul,months){BIZ.forEach(b=>{if(s.biz[b.id])bmod(s,b.id,mul,months);});}
function later(s,months,key,data){s.later.push({m:s.m+months,key,data:data||{}});}
function R(s,opts){let tot=0;const ws=opts.map(o=>{const w=Math.max(0,typeof o[0]==='function'?o[0](s):o[0]);tot+=w;return w;});
 let r=Math.random()*tot;for(let i=0;i<opts.length;i++){r-=ws[i];if(r<=0)return opts[i][1](s);}return opts[opts.length-1][1](s);}
function corpPick(s,heldP,mustHold,secs){const cand=ASSETS.filter(a=>isStock(a)&&avail(s,a)&&!a.pyramid&&a.id!=='btc'&&a.sec!=='spec'&&(!secs||secs.includes(a.sec)));
 const held=cand.filter(a=>s.hold[a.id]>0);if(mustHold)return held.length?pick(held).id:null;if(!cand.length)return null;
 if(held.length&&chance(heldP))return pick(held).id;return pick(cand).id;}
function corpBet(s,f){const id=s.ctx.id;const q=buyAsset(s,id,s.cash*f);if(!q)return 'Денег не хватило даже на одну акцию.';
 return R(s,[[()=>s.ctx.p+s.rep/5,s=>{shockAsset(s,id,.3);tilt(s,id,.15);addHeat(s,8);return `Купил ${fmt(q)} шт. Через неделю новость вышла — бумага взлетела! Правда, в комиссии по ценным бумагам интересуются, кто скупал заранее.`;}],
  [()=>100-s.ctx.p,s=>{shockAsset(s,id,-.08);return `Купил ${fmt(q)} шт. Неделя тишины. Потом ещё неделя. Похоже, «большое» было не про это.`;}]]);}
function corpFate(s,id,keep){if(chance(.45))tilt(s,id,-.35);return keep?'Держишь. Время покажет, временная это паника или конец.':'';}

// ---------- месяц ----------
function tickMonth(s){
 const L=[];let inc=0;s.stats.incBy={};s.notes=[];
 BIZ.forEach(b=>{const n=s.biz[b.id];if(!n)return;let x=0;for(let i=0;i<n;i++)x+=rnd(b.inc[0],b.inc[1]);x*=(b.curve?b.curve(s.m):1);
  if(s.flags.tax13)x*=x>0?1.05:1;if(s.flags.crisis&&s.m<s.flags.crisis&&b.id!=='club')x*=.75;x*=s.mod.inc;
  const bm=s.bm[b.id];if(bm){if(bm.until>s.m)x*=bm.mul;else delete s.bm[b.id];}
  s.stats.incBy[b.id]=x;inc+=x;if(b.heat)addHeat(s,b.heat*n);if(b.rep)addRep(s,b.rep*n);});
 if(bizCount(s)>0)L.push(['Доход с бизнеса',inc]);
 s.cash+=Math.round(inc);s.stats.lastInc=inc;
 if(s.m%3===2){let dv=0;ASSETS.forEach(a=>{if(a.div&&s.hold[a.id]&&avail(s,a))dv+=s.hold[a.id]*s.price[a.id]*a.div;});if(dv>=1){dv=Math.round(dv);s.cash+=dv;s.stats.divs+=dv;L.push(['Дивиденды за квартал',dv]);}}
 if(s.krysha!=='none'&&!kryshaOpen(s,s.krysha)){addLog(s,`${KRYSHA[s.krysha].name} — всё, эпоха кончилась.`);s.krysha='none';}
 const k=KRYSHA[s.krysha];if(k.fee){const fee=k.fee+Math.max(0,inc)*k.pct;s.cash-=Math.round(fee);L.push([k.name,-fee]);}

function openFarm(){
 const s=S;if(triesLeft(s,'farm')<=0){toast('Энергия кончилась. Ферма — в следующем месяце.');return;}
 const G=GAMES.find(x=>x.id==='farm');const cap=betCap(s,G);

 const ff=g.body.querySelector('#ff'),cells=[...ff.children],msg=g.body.querySelector('#fm'),go=g.body.querySelector('#go'),ft=g.body.querySelector('#ft'),fs=g.body.querySelector('#fs');

 betCtl(g.body.querySelector('#bet'),st,()=>{go.disabled=st.bet<100||st.bet>S.cash||on;},cap);
 const loop=()=>{if(!on)return;const now=performance.now();const left=Math.max(0,DUR-(now-t0));ft.textContent='0:'+String(Math.ceil(left/1000)).padStart(2,'0');
  for(let i=0;i<16;i++){if(state[i]&&now>ttl[i]){if(state[i]===1){state[i]=2;ttl[i]=now+rnd(700,1300)-Math.min(400,score*10);}else if(state[i]===3){state[i]=0;score=Math.max(0,score-2);fs.textContent='Урожай: '+score;}else state[i]=0;}}

 go.onclick=()=>{if(on||st.bet<100||st.bet>S.cash)return;if(!useTry(s,'farm'))return;s.cash-=st.bet;render();on=true;g.locked=true;st.lock=true;score=0;fs.textContent='Урожай: 0';state.fill(0);t0=performance.now();go.disabled=true;msg.textContent='Собирай!';loop();};

}

// --- векторный SVG: моно (силуэт) или цветной с тёмными деталями
function iconSVG(name,o={}){const ic=ICONS[name]||ICONS.biz;const W={s:2,S:3.2,t:1.4,K:1.8};
 const mono=o.mono,col=o.grad&&o.mono?'url(#g)':(o.color||'#000'),pal=ic.c,hole=o.hole||pal[2]||'#22303F';let acc='',n=0,defs='';
 const paint=(p)=>{const [m,d,ci]=p;const c=mono?col:(pal[ci||0]||pal[0]);
  if(m==='f')return `<path d="${d}" fill="${c}"${!mono&&o.outline?` stroke="${o.outline}" stroke-width=".9" stroke-linejoin="round"`:''}/>`;
  return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${W[m]}" stroke-linecap="round" stroke-linejoin="round"/>`;};
 ic.p.forEach(p=>{const [m,d]=p;
  if(m==='k'||m==='K'){if(mono){n++;const sh=m==='k'?`<path d="${d}" fill="#000"/>`:`<path d="${d}" stroke="#000" stroke-width="${W.K}" fill="none" stroke-linecap="round"/>`;
    defs+=`<mask id="m${n}" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="#fff"/>${sh}</mask>`;acc=`<g mask="url(#m${n})">${acc}</g>`;}
   else acc+=m==='k'?`<path d="${d}" fill="${hole}"/>`:`<path d="${d}" fill="none" stroke="${hole}" stroke-width="${W.K}" stroke-linecap="round"/>`;}
  else acc+=paint(p);});
 if(o.grad&&mono)defs+=`<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.grad[0]}"/><stop offset="1" stop-color="${o.grad[1]}"/></linearGradient>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${o.size||24}" height="${o.size||24}">${defs?`<defs>${defs}</defs>`:''}${acc}</svg>`;}
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);

function tileSVG(name,o={}){const ic=ICONS[name]||ICONS.biz;const base=o.bg||ic.c[0];const r=o.r==null?5.4:o.r;
 const inner=iconSVG(name,{mono:true,color:'#FFFFFF'}).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
 const light=mix(base,'#FFFFFF',.35),dark=mix(base,'#000000',.3);const fg=lum(base)>.72?mix(base,'#000000',.62):'#FFFFFF';
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48"><defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${light}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>
<rect x=".5" y=".5" width="23" height="23" rx="${r}" fill="url(#t)" stroke="rgba(0,0,0,.35)" stroke-width=".6"/>
<g transform="translate(5 5) scale(.5833)">${fg==='#FFFFFF'?inner:inner.replace(/#FFFFFF/g,fg)}</g>
${o.gloss!==false?`<path d="M.5 ${r+.5}A${r} ${r} 0 0 1 ${r+.5} .5H${23.5-r}A${r} ${r} 0 0 1 23.5 ${r+.5}V10.2C17 12.6 7 12.6 .5 10.2Z" fill="rgba(255,255,255,.32)"/>`:''}</svg>`;}
function hex2(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function mix(a,b,t){const A=hex2(a),B=hex2(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
function lum(a){const [r,g,b]=hex2(a);return (r*.3+g*.59+b*.11)/255;}

// --- пиксельный рендер на канвасе (синхронно): 1-бит для LCD, 16 цветов с обводкой для 98-го, плитка для раскладушки
function iconPX(name,mode,size,col){const key=`${name}|${mode}|${size}|${col||''}`;if(GFXC[key])return GFXC[key];

 const minW=24/inner*1.05;const W={s:Math.max(2,minW),S:Math.max(3.2,minW*1.6),t:Math.max(1.4,minW),K:Math.max(1.8,minW)};

 ic.p.forEach(([m,d,ci])=>{const P=new Path2D(d);
  if(m==='k'||m==='K'){if(mode==='w98'){x.globalCompositeOperation='source-over';if(m==='k'){x.fillStyle=hole;x.fill(P);}else{x.strokeStyle=hole;x.lineWidth=W.K;x.stroke(P);}}
   else{x.globalCompositeOperation='destination-out';if(m==='k')x.fill(P);else{x.lineWidth=W.K;x.stroke(P);}x.globalCompositeOperation='source-over';}return;}
  x.fillStyle=x.strokeStyle=colorOf(ci);if(m==='f')x.fill(P);else{x.lineWidth=W[m];x.stroke(P);}});
 x.restore();
 const img=x.getImageData(0,0,S,S),p=img.data;
 for(let i=0;i<p.length;i+=4){if(p[i+3]<110){p[i+3]=0;}else{p[i+3]=255;}}
 if(mode==='w98'){const a=i=>p[i*4+3]>0;const out=[];for(let y=0;y<S;y++)for(let X=0;X<S;X++){const i=y*S+X;if(a(i))continue;
   if((X>0&&a(i-1))||(X<S-1&&a(i+1))||(y>0&&a(i-S))||(y<S-1&&a(i+S)))out.push(i);}
  out.forEach(i=>{p[i*4]=0;p[i*4+1]=0;p[i*4+2]=0;p[i*4+3]=255;});}

 if(mode==='tile'){const t=document.createElement('canvas');t.width=S;t.height=S;const y=t.getContext('2d');const base=col||(lum(pal[0])>.72?(pal[1]&&lum(pal[1])<.6?pal[1]:'#5A6470'):pal[0]);
  const g=y.createLinearGradient(0,0,0,S);g.addColorStop(0,mix(base,'#FFFFFF',.3));g.addColorStop(1,mix(base,'#000000',.25));y.fillStyle=g;
  const r=Math.round(S*.22);y.beginPath();y.moveTo(r,0);y.arcTo(S,0,S,S,r);y.arcTo(S,S,0,S,r);y.arcTo(0,S,0,0,r);y.arcTo(0,0,S,0,r);y.fill();
  y.fillStyle='rgba(255,255,255,.25)';y.fillRect(2,1,S-4,Math.round(S*.38));y.drawImage(c,0,0);GFXC[key]=t.toDataURL();}

function fxLoop(){const x=FX.x,c=FX.c;x.clearRect(0,0,c.width,c.height);x.textBaseline='middle';x.textAlign='center';FX.p=FX.p.filter(p=>p.life>0);
 FX.p.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;x.save();x.translate(p.x*FX.dpr,p.y*FX.dpr);x.rotate(p.rot);x.globalAlpha=Math.min(1,p.life/25);
  x.font=`700 ${p.size*FX.dpr}px "PT Mono", monospace`;x.fillStyle=p.col;x.fillText(p.ch,0,0);x.restore();});
 FX.raf=FX.p.length?requestAnimationFrame(fxLoop):0;}

function countTo(el,from,to){if(reduced()||Math.abs(to-from)<2){el.textContent=fmt(to);return;}const t0=performance.now(),D=650;let lt=0;
 el.classList.remove('pulse-up','pulse-dn');void el.offsetWidth;el.classList.add(to>from?'pulse-up':'pulse-dn');
 const f=now=>{const k=Math.min(1,(now-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(now-lt>70&&k<1){lt=now;SND.tick();}if(k<1&&el.isConnected)requestAnimationFrame(f);};requestAnimationFrame(f);}
function noiseCanvas(el,ms){const c=document.createElement('canvas');c.className='noise';c.width=120;c.height=200;el.prepend(c);const x=c.getContext('2d');const t0=performance.now();
 return new Promise(res=>{const f=now=>{const d=x.createImageData(120,200);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);

function snap(s){return {cash:s.cash,debt:s.debt,hp:s.hp,rep:s.rep,heat:s.heat,inc:s.mod.inc,hold:{...s.hold},biz:{...s.biz}};}
function diffSnap(a,b){const d=[];const n=v=>(v>0?'+':'−')+fmt(Math.abs(v));
 if(Math.round(b.cash-a.cash))d.push({t:`${n(b.cash-a.cash)} руб.`,pos:b.cash>a.cash,big:1});
 if(Math.round(b.debt-a.debt))d.push({t:`Долг ${n(b.debt-a.debt)}`,pos:b.debt<a.debt});
 if(b.hp!==a.hp)d.push({t:`Здоровье ${n(b.hp-a.hp)}`,pos:b.hp>a.hp});
 if(b.rep!==a.rep)d.push({t:`Связи ${n(b.rep-a.rep)}`,pos:b.rep>a.rep});
 if(b.heat!==a.heat)d.push({t:`Риск проверки ${n(b.heat-a.heat)}`,pos:b.heat<a.heat});
 if(Math.abs(b.inc-a.inc)>.001){const p=Math.round((b.inc/a.inc-1)*100);if(p)d.push({t:`Выручка ${p>0?'+':'−'}${Math.abs(p)}% (след. мес.)`,pos:p>0});}
 ASSETS.forEach(x=>{const v=b.hold[x.id]-a.hold[x.id];if(v)d.push({t:`${x.name} ${n(v)}`,pos:v>0});});
 BIZ.forEach(x=>{const v=b.biz[x.id]-a.biz[x.id];if(v)d.push({t:`${x.name} ${n(v)}`,pos:v>0});});
 return d;}
function fxForDiff(a,b){const dc=b.cash-a.cash;
 if(dc>0){SND.cash();if(dc>Math.max(20000,a.cash*.25))rain(dc>a.cash?60:30);}
 else if(dc<0||b.hp<a.hp||b.heat>a.heat+5){SND.bad();if(-dc>Math.max(20000,a.cash*.2)||a.hp-b.hp>=10)shake();}}

async function runEvent(e){
 const s=S;if(e.cond&&!e.cond(s))return;if(e.pre)e.pre(s);const text=evText(s,e);const from=evFrom(s,e);
 const chs=e.ch.map(c=>({label:c[0],disabled:!needOk(s,c[2])}));if(chs.every(c=>c.disabled))chs[chs.length-1].disabled=false;
 eventSound(e);
 const k=await dialog({kind:e.k,from,title:e.tt,alarm:e.alarm,text,choices:chs,art:e.art});
 const before=snap(s);const res=resolveOut(s,e,k);evDone(s,e);s.stats.events++;
 const after=snap(s);const d=diffSnap(before,after);
 addLog(s,`${e.k==='tv'?(e.tt||'Новости'):(from||e.tt)}: «${e.ch[k][0].replace(/^«|»$/g,'')}»`);
 render();fxForDiff(before,after);
 if(res||d.length)await dialog({kind:e.k,from,title:e.tt,alarm:e.alarm,text:res,choices:[{label:pick(OK_WORDS[ERA(s.m)])}],diff:d,speed:3});
 render();
}
async function runMonthEvents(){const evs=pickEvents(S);for(const e of evs){if(!S)return true;await runEvent(e);if(await checkDoom())return true;}return false;}
async function checkDoom(){
 const s=S;if(!s)return true;
 if(s.over){await ending(s.over);return true;}
 if(s.hp<=0){await ending('dead');return true;}
 if(s.heat>=100){
  if(s.flags.deputy){s.heat=55;await dialog({kind:'tv',alarm:1,title:'НЕПРИКОСНОВЕННОСТЬ',text:'За тобой пришли, но ты показал депутатскую корочку. Ушли, извиняясь.'});render();return false;}
  const cost=Math.round(Math.max(50000,netWorth(s)*.4));SND.alarm();shake();
  const i=await dialog({kind:'tv',alarm:1,title:'УГОЛОВНОЕ ДЕЛО',art:'ev_taxraid',text:`Риск проверки дошёл до предела: на тебя завели дело. Приехали люди с папками и без улыбок.\n\nАдвокат шепчет: «Решить вопрос — ${fmt(cost)} руб.»`,choices:[{label:`Решить вопрос (${fmt(cost)})`,disabled:s.cash<cost},{label:'Сесть (конец игры)'}]});
  if(i===0){s.cash-=cost;s.heat=35;addLog(s,'Дело закрыли. Очень дорого.');render();return false;}
  await ending('jail');return true;}
 if(s.debt>500000&&netWorth(s)<-s.debt*.5){await ending('broke');return true;}
 return false;
}

 el.innerHTML=`<div class="inner"><div class="t1 b1" style="font-family:var(--f-pix);font-size:12px">ВКЛЮЧЕНИЕ…</div></div>`;
 const fin=()=>{if(skip)return;skip=true;el.remove();res();};el.addEventListener('pointerdown',()=>{SND.init();fin();});
 (async()=>{await sleep(reduced()?5:700);if(skip)return;el.querySelector('.b1').innerHTML='ДОБРО<br>ПОЖАЛОВАТЬ';await sleep(reduced()?5:900);if(skip)return;
  el.querySelector('.b1').innerHTML='ПОИСК СЕТИ…';await sleep(reduced()?5:700);fin();})();});}
async function startNew(){
 const r=await dialog({kind:'sms',from:'СИСТЕМА',text:'Введи своё имя. Батя будет звать тебя именно так. Ну, или «сынок».',input:'Димон',choices:[{label:'ОК'}]});
 const name=(r.val||'').trim().slice(0,16)||'Димон';
 S=newGame(name);UI.lastCash=null;UI.lastTab=null;UI.theme=null;if(TITLE){TITLE.remove();TITLE=null;}render();SND.cash();
 BUSY=true;
 try{await dialog({kind:'tv',title:'КАК ИГРАТЬ',speed:6,text:'Январь 2000-го. Тебе 18, у тебя 100 000 руб. и батин ларёк. Впереди — десять лет и шесть поколений девайсов.\n\n'+HOWTO+'\n\nКнопка «Дальше» листает месяц.',choices:[{label:'Погнали'}]});
  await runMonthEvents();}
 finally{BUSY=false;if(S){save();render();}}
}
function init(data){
 screenEl=document.getElementById('screen');FX.c=document.getElementById('fx');FX.x=FX.c.getContext('2d');fxResize();addEventListener('resize',()=>{fxResize();if(S&&!BUSY)render();});
 TK.el=document.getElementById('tk');requestAnimationFrame(tickerLoop);loadOpts();
 Object.keys(ART).forEach(id=>{if(!ARTI[id]){const i=new Image();i.src=ART[id];ARTI[id]=i;}});
 document.addEventListener('pointerdown',()=>{UI.kbd=false;SND.init();if(S)nudge();});
 document.addEventListener('keydown',()=>{UI.kbd=true;},true);
 {const mn=document.getElementById('main');let sx=0,sy=0,st=0,ok=false;
  mn.addEventListener('touchstart',e=>{const t=e.touches[0];ok=e.touches.length===1&&!e.target.closest('canvas,.secs,.qty,input,.gw');sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
  mn.addEventListener('touchend',e=>{if(!ok||!S||BUSY||document.querySelector('.ov,.gw,.seq'))return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
   if(Math.abs(dx)>70&&Math.abs(dx)>2.2*Math.abs(dy)&&Date.now()-st<600)act(dx<0?'tabn':'tabp');},{passive:true});}
 screenEl.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act);});
 addEventListener('keydown',e=>{if(!S||document.querySelector('.ov,.gw,.seq,.credits'))return;
  if(e.key>='1'&&e.key<='5')act('tab:'+TABS[+e.key-1][0]);if(e.key==='ArrowRight')act('tabn');if(e.key==='ArrowLeft')act('tabp');if(e.key==='Enter'){e.preventDefault();nextMonth();}});
 if(data&&data.S&&data.S.v===4){S=data.S;render();return;}
 setTheme('n3310');boot().then(showTitle);
}
(function(){const hot=window.claude&&window.claude.hot;try{if(hot&&hot.snapshot)hot.snapshot(()=>({S}));}catch(e){}
 const go=()=>{if(hot&&hot.ready)hot.ready(init);else init((hot&&hot.data)||{});};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();
